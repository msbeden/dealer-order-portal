name: Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend:
    name: Backend Build & Test (.NET 9)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore DealerPortal.sln

      - name: Build solution
        run: dotnet build DealerPortal.sln -c Release --no-restore

      - name: Execute unit tests
        run: dotnet test backend/tests/DealerPortal.UnitTests/DealerPortal.UnitTests.csproj -c Release --no-build --verbosity normal

  frontend:
    name: Frontend Build (Angular 19)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Angular application
        working-directory: frontend
        run: npm run build -- --configuration production
